services:

  nginx:
    build:
      context: ./nginx

    container_name: terrifyingtees-nginx

    ports:
      - "80:80"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend

    container_name: terrifyingtees-backend

    env_file:
      - ./backend/.env

    expose:
      - "3001"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend

    container_name: terrifyingtees-frontend

    expose:
      - "3000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    depends_on:
      - backend